name: Prepare 4.0.0.18 recovery release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-4018.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update plugin version and readme
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          main = Path('avd-cta-insights.php')
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 4.0.0.15', 'Version: 4.0.0.18', 1)
          text = text.replace("const VERSION = '4.0.0.15';", "const VERSION = '4.0.0.18';", 1)
          main.write_text(text, encoding='utf-8')

          readme = Path('readme.txt')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Stable tag: 4.0.0.15', 'Stable tag: 4.0.0.18', 1)

          marker = '== Changelog ==\n'
          entry = '''\n= 4.0.0.18 =\n* Fixed the admin tracking test after the AJAX action rename.\n* Added recovery for legacy AVD tracking data without deleting old options.\n* Added a durable event archive so statistics no longer disappear when the recent-event buffer reaches its limit.\n* Restored archived events in dashboard and AI statistics.\n\n'''

          if '= 4.0.0.18 =' not in text and marker in text:
              text = text.replace(marker, marker + entry, 1)

          readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/release-4018.yml

      - name: Commit recovery release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avd-cta-insights.php readme.txt
          git commit -m 'Release 4.0.0.18 stats recovery fix'
          git push
