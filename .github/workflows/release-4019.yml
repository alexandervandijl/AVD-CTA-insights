name: Prepare 4.0.0.19 Project Bridge release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-4019.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update plugin version and readme
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          main = Path('avd-cta-insights.php')
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 4.0.0.18', 'Version: 4.0.0.19', 1)
          text = text.replace("const VERSION = '4.0.0.18';", "const VERSION = '4.0.0.19';", 1)
          main.write_text(text, encoding='utf-8')

          readme = Path('readme.txt')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Stable tag: 4.0.0.18', 'Stable tag: 4.0.0.19', 1)

          marker = '== Changelog ==\n'
          entry = '''\n= 4.0.0.19 =\n* Added the opt-in Project Bridge for measurable cross-project traffic.\n* Added configurable project, audience and overview CTA destinations.\n* Added Project Bridge impression, click-session and CTR reporting.\n* Added shortcode and optional homepage placement without automatic publication.\n\n'''

          if '= 4.0.0.19 =' not in text and marker in text:
              text = text.replace(marker, marker + entry, 1)

          readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/release-4019.yml

      - name: Commit Project Bridge release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avd-cta-insights.php readme.txt
          git commit -m 'Release 4.0.0.19 Project Bridge'
          git push
